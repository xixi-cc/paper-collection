<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0f1ef" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('paper-collection-xncao-theme');
          const theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : 'light';
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0f1419' : '#f0f1ef';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta name="description" content="Xncao's personal paper collection." />
    <meta property="og:title" content="Paper Collection-Xncao" />

    <meta property="og:image" content="https://xixi-paper-collection.lezontbukercfdvs4.chatgpt.site/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
